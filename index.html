<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Element RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game">
    <canvas id="canvas" width="960" height="540"></canvas>

    <div id="hud">
      <div class="bar">
        <span>HP</span>
        <div class="bar-bg">
          <div id="hp" class="bar-fill hp"></div>
        </div>
      </div>

      <div class="bar">
        <span>Energy</span>
        <div class="bar-bg">
          <div id="energy" class="bar-fill energy"></div>
        </div>
      </div>

      <div class="stats">
        <span>⭐ Lv.<b id="level">1</b></span>
        <span>XP: <b id="xp">0</b>/100</span>
        <span>💎 <b id="coins">0</b></span>
      </div>
    </div>

    <div id="message">WASD to move • SPACE to attack • E for Elemental Burst</div>

    <div id="gameOver">
      <h1>YOU DIED</h1>
      <p>Press R to restart</p>
    </div>
  </div>

  <script src="script.js"></script>











  
</body>
</html>
